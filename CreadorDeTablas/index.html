<label for="CustomCSS">CSS personalizado</label>
<br>
<textarea class="CodeTextArea" id="CustomCSS">
table {
    border-collapse: collapse;
    font-size: 0.9em;
    font-family: sans-serif;
    min-width: 400px;
    color: black;
}

table thead tr {
    background-color: #001839;
    color: #ffffff;
    text-align: left;
}

table thead tr {
  border-right: solid 1px #001839;
  border-left: solid 1px #001839;
}

table th, table td {
    padding: 5px 5px;
    font-weight: normal;
}

table tbody tr {
    border-bottom: 1px solid #dddddd;
}

table tbody tr:nth-of-type(even) td {
	background-color: #e4e7eb;
	border: solid black;
	border-width: 0px 1px;
}

table tbody tr:nth-of-type(odd) td {
	background-color: #b5d8e9;
	border: solid black;
	border-width: 0px 1px;
}

table tbody tr td div, table thead tr th div {
    text-align: center;
}

table thead tr th div span, table thead tr th div {
font-size: 1rem;
}
</textarea>
